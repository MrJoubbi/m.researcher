# ==============================================================================
# Nginx Configuration for Moroccan Researcher (Production SPA & Clean URLs)
# Place in: /etc/nginx/sites-available/default (or /etc/nginx/sites-available/moroccanresearcher.com)
# ==============================================================================

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name moroccanresearcher.com www.moroccanresearcher.com _;

    root /var/www/html;
    index index.html index.htm;

    # Gzip compression for high Google PageSpeed & SEO score
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Security Headers for production SEO & ranking
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Core SPA routing rule: Allows /blog, /Formations, /Nos_Services, /Contact, and /blog/article-slug to work directly!
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets caching (1 month cache for CSS, JS, Fonts, Images)
    location ~* \.(?:css|js|woff|woff2|ttf|eot|svg|png|jpg|jpeg|gif|webp|ico)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Disallow hidden files (e.g. .git, .env)
    location ~ /\. {
        deny all;
    }
}
